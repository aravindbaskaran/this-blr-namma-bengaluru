# Renders Kannada clips into docs/audio/kn/.
#
# Manual only: run it from the Actions tab when you add phrases. It used to fire
# on every docs/index.html push, then fail on GitHub-hosted runners because
# parler-tts pulled a CUDA torchaudio (libcudart.so.13).
#
# Rendering needs an HF_TOKEN secret, because the voice model is gated. Without
# one this still reports which phrases lack audio - it just cannot render them.
name: Kannada audio

on:
  workflow_dispatch:

jobs:
  render:
    name: Render missing clips
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Is there anything to do?
        id: todo
        run: |
          if python scripts/build-kannada-audio.py --check; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ -z "$HF_TOKEN" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Some phrases have no audio and there is no HF_TOKEN secret, so they cannot be rendered here. They fall back to the device voice. To turn this on, add an HF_TOKEN secret (see the Kannada audio section of the README); otherwise run scripts/build-kannada-audio.py locally and commit the clips."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install ffmpeg
        if: steps.todo.outputs.needed == 'true'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        if: steps.todo.outputs.needed == 'true'
        run: |
          pip install --quiet torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet numpy "git+https://github.com/huggingface/parler-tts.git"

      - name: Cache the voice model
        if: steps.todo.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-indic-parler-tts-v1-cpu

      - name: Render
        if: steps.todo.outputs.needed == 'true'
        run: python scripts/build-kannada-audio.py

      - name: Commit new clips
        if: steps.todo.outputs.needed == 'true'
        run: |
          if [ -z "$(git status --porcelain docs/audio/kn)" ]; then
            echo "nothing changed"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/audio/kn
          git commit -m "Render Kannada audio for new phrases"
          git push

# Reports Kannada phrases that have no audio.
#
# It does not render. Rendering needs a GPU: a full voice is a couple of hours on a
# laptop, and on GitHub-hosted runners parler-tts pulls a CUDA torchaudio that cannot
# load, so the render job here only ever failed. Making clips is a job for a machine
# with a GPU, either a contributor's own or the Colab notebook in scripts/.
#
# So this stays cheap and green: it tells you what is missing and where to make it.
# A phrase without a clip is not broken, it just falls back to the device voice.
name: Kannada audio

on:
  push:
    paths:
      - 'docs/data/**.json'
      - 'docs/index.html'
      - 'docs/audio/kn/**'
      - 'scripts/build-kannada-audio.py'
      - '.github/workflows/kannada-audio.yml'
  pull_request:
    paths:
      - 'docs/data/**.json'
      - 'docs/index.html'
      - 'docs/audio/kn/**'
  workflow_dispatch:

jobs:
  check:
    name: Every phrase has a clip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No model, no token, no GPU: this only compares the phrases on the site
      # against docs/audio/kn/manifest.json and the files next to it.
      - name: Look for phrases with no audio
        id: check
        run: python scripts/build-kannada-audio.py --check

      - name: How to make the missing clips
        if: failure()
        run: |
          echo "::notice::Some phrases have no audio. Render them on a machine with a GPU:"
          echo "::notice::  locally  - python scripts/build-kannada-audio.py  (see the README)"
          echo "::notice::  or Colab - scripts/render-audio-colab.ipynb, which pushes back to your branch"

# Reports Kannada phrases that have no audio.
#
# It does not render. Rendering needs a GPU: a full voice is a couple of hours on a
# laptop, and on GitHub-hosted runners parler-tts pulls a CUDA torchaudio that cannot
# load, so the render job here only ever failed. Making clips is a job for a machine
# with a GPU, either a contributor's own or the Colab notebook in scripts/.
#
# Two jobs, so a pause is a skip and not a red X:
#   inventory  always runs. Lists phrases still waiting on a render. Fails only
#              when the audio on disk contradicts the manifest.
#   clips      runs only when inventory found nothing waiting. Otherwise GitHub
#              skips it, which is the paused state. Do not mark this job as a
#              required check: a skipped required check blocks the merge.
#
# A phrase without a clip is not broken, it just falls back to the device voice.
name: Kannada audio

on:
  push:
    paths:
      - 'docs/data/**.json'
      - 'docs/index.html'
      - 'docs/audio/kn/**'
      - 'scripts/build-kannada-audio.py'
      - '.github/workflows/kannada-audio.yml'
  pull_request:
    paths:
      - 'docs/data/**.json'
      - 'docs/index.html'
      - 'docs/audio/kn/**'
      - 'scripts/build-kannada-audio.py'
      - '.github/workflows/kannada-audio.yml'
  workflow_dispatch:

jobs:
  inventory:
    name: Phrases and clips line up
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.check.outputs.pending }}
      problems: ${{ steps.check.outputs.problems }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No model, no token, no GPU. Compares the phrases on the site against
      # docs/audio/kn/manifest.json and the files next to it, then writes
      # pending= and problems= for the clips job's `if:`.
      - name: Look for phrases with no audio
        id: check
        run: python scripts/build-kannada-audio.py --check

  clips:
    name: Every phrase has a clip
    needs: inventory
    if: needs.inventory.result == 'success' && needs.inventory.outputs.pending == '0'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Every phrase has a clip in both voices."
